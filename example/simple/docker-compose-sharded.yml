version: '3.8'

services:
  # Config Server
  mongo-config:
    image: mongo:6.0
    container_name: mongo-config
    restart: always
    ports:
      - "27019:27017"
    volumes:
      - mongo-config-data:/data/db
    command: --configsvr --replSet configReplSet --bind_ip_all --noauth
    networks:
      - mongo-cluster

  # Shard 1
  mongo-shard1:
    image: mongo:6.0
    container_name: mongo-shard1
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-shard1-data:/data/db
    command: --shardsvr --replSet shard1ReplSet --bind_ip_all --noauth
    networks:
      - mongo-cluster

  # Mongos Router
  mongos:
    image: mongo:6.0
    container_name: mongos
    restart: always
    ports:
      - "27017:27017"
    command: mongos --configdb configReplSet/mongo-config:27017 --bind_ip_all --noauth
    depends_on:
      - mongo-config
      - mongo-shard1
    networks:
      - mongo-cluster

  # Initialization service
  mongo-init:
    image: mongo:6.0
    container_name: mongo-init
    depends_on:
      - mongo-config
      - mongo-shard1
      - mongos
    networks:
      - mongo-cluster
    command: >
      bash -c "
        echo 'Waiting for MongoDB services to start...' &&
        sleep 20 &&
        
        echo 'Initializing config server replica set...' &&
        mongosh --host mongo-config:27017 --eval \"
          rs.initiate({
            _id: 'configReplSet',
            configsvr: true,
            members: [{
              _id: 0,
              host: 'mongo-config:27017'
            }]
          })
        \" &&
        
        echo 'Waiting for config server to be ready...' &&
        sleep 10 &&
        
        echo 'Initializing shard replica set...' &&
        mongosh --host mongo-shard1:27017 --eval \"
          rs.initiate({
            _id: 'shard1ReplSet',
            members: [{
              _id: 0,
              host: 'mongo-shard1:27017'
            }]
          })
        \" &&
        
        echo 'Waiting for shard to be ready...' &&
        sleep 10 &&
        
        echo 'Adding shard to cluster...' &&
        mongosh --host mongos:27017 --eval \"
          sh.addShard('shard1ReplSet/mongo-shard1:27017')
        \" &&
        
        echo 'Creating database and enabling sharding...' &&
        mongosh --host mongos:27017 --eval \"
          use seller_contents_db;
          sh.enableSharding('seller_contents_db');
          sh.shardCollection('seller_contents_db.seller_contents', { '_id': 1 });
          sh.shardCollection('seller_contents_db.checkpoint-SellerContents', { '_id': 1 });
        \" &&
        
        echo 'Sharded cluster setup completed!'
      "

volumes:
  mongo-config-data:
  mongo-shard1-data:

networks:
  mongo-cluster:
    driver: bridge 